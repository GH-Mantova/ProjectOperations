name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a PR's in-flight run when a newer commit is pushed to the same PR.
# Pushes to main are never cancelled — every trunk commit gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deterministic 32-byte hex key used solely for CI tests. Real
  # production keys live in Azure Key Vault and are never committed.
  BYOK_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  # Opt-in to Node 24 runtime for JavaScript actions ahead of GitHub's
  # 2026-06-16 Node 20 → 24 force-migration deadline.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Decide whether this PR touches any build/test-relevant path. Docs-, prompt-
  # and sot-only PRs (docs/**, sot/**, *.md) yield code=false, letting the heavy
  # jobs below skip. A required job skipped via a job-level `if:` still satisfies
  # branch protection (unlike a workflow-level paths filter, which would leave the
  # required check pending forever). Pushes to main always yield code=true.
  changes:
    name: Changed-path filter
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        name: Detect build/test-relevant changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/|packages/|prisma/|tests/|scripts/|\.github/workflows/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig)'; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: API — lint, test, compliance smoke
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # test:canonical / test:api:serial run jest --runInBand (single process) and
    # peak near Node's default ~4 GB heap; a random OOM (exit 134) flakes PRs
    # (e.g. #1113 on a docs-only diff). Raise the ceiling for every step here.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: project_ops
          POSTGRES_PASSWORD: project_ops
          POSTGRES_DB: project_operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @project-ops/api exec puppeteer browsers install chrome
      - run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
      - run: pnpm prisma:migrate
        env:
          DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
      - run: pnpm seed
        env:
          DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          SHAREPOINT_MODE: mock
      - run: pnpm --filter @project-ops/api lint
      - run: pnpm test:api:serial
        env:
          DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          SHAREPOINT_MODE: mock
      - run: pnpm compliance:smoke
        env:
          DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          SHAREPOINT_MODE: mock
      - run: pnpm test:canonical
        env:
          DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          SHAREPOINT_MODE: mock

  data-model-drift:
    name: Data model — generator sanity (schema.prisma parses cleanly)
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22' }
      - name: Run relationship-map generator against schema.prisma
        # The JSON/MD outputs are gitignored (they churned every PR when committed).
        # This gate re-runs the generator fresh and fails only if it errors or
        # cannot resolve a model/enum reference in schema.prisma.
        run: node scripts/data-model/build-relationship-map.mjs --check

  pr-gates:
    name: PR gates — diff checks (CP-09–13, CP-17, CP-22, CP-23)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22' }
      - run: node scripts/pr-gates/pr-gates.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  pipeline-tests:
    name: Pipeline — watcher + linter tests
    # UNCONDITIONAL — no `needs: changes` gate. A PR touching scripts/pr-watcher/**
    # must never be able to skip these tests via the path filter. The suites are
    # pure Node with no external deps, so the job is fast enough to run always.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. The intake linter's
      # CLUSTER_DEAD_GATE rule probes `git show origin/main:<path>`. A default
      # shallow checkout (depth 1) has no origin/main ref, so the probe fails,
      # the linter takes its documented warn-and-skip fail-safe, and the rule
      # silently NO-OPS. That made test-lint-prompt's `cluster-dead-gate` case
      # fail (ADMIT where REJECT was wanted) and — worse — made its sibling
      # `cluster-dead-gate-git-broken` pass vacuously, since both then took the
      # same code path. A safety rule that quietly does nothing in CI is the
      # exact failure this cluster exists to prevent.
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22' }
      # IMPORTANT: the double-quotes around the glob are load-bearing.
      # `node --test scripts/pr-watcher/__tests__/` (bare directory) exits 1
      # having discovered 0 tests on Node 22 — it looks like a test failure but
      # is actually a non-discovery. The shell-expanded glob passes individual
      # file paths, which Node --test accepts correctly.
      - run: node --test "scripts/pr-watcher/__tests__/*.mjs"
      - run: node --test "scripts/pipeline/__tests__/*.mjs"
      - run: node scripts/pipeline/test-lint-prompt.mjs
      # Station instruction docs get the same treatment the prompt queue gets.
      # Before this gate, five pasted copies of station behaviour drifted for weeks and
      # four of them carried advice the pipeline had already disproved - including one
      # telling the supervisor to relaunch a launcher that is not the real one.
      - run: node scripts/pipeline/lint-station.mjs
      # The report contract, enforced on the reports themselves. lint-station checks that a
      # station DOC says where findings go; this checks that a station RUN put them there.
      # Structure only in CI - the freshness check needs a live box and would always fail here.
      - run: node scripts/pipeline/check-breadcrumb.mjs
      # --- sot/ and pipeline register checkers ---
      # Polarities differ per checker; each step's handling is documented inline.
      # check-sot-refs: exit 0 = all references resolve; non-zero = dangling path(s).
      - name: check-sot-refs
        run: node scripts/pipeline/check-sot-refs.mjs
      # check-lessons: exit 0 = clean (no regressions); exit 1 = broken instrument;
      # exit 2 = at least one lesson has regressed. All non-zero are failures.
      - name: check-lessons
        run: node scripts/pipeline/check-lessons.mjs
      # check-escalations: exit 0 = ran cleanly; exit 1 = register malformed or
      # evaluator self-test failed. Non-zero is a failure.
      - name: check-escalations
        run: node scripts/pipeline/check-escalations.mjs
      # check-backlog: exit 0 = nothing newly ready; exit 10 = READY TO STAGE (a good
      # signal, not an error — do NOT fail CI on it); exit 1/2/3 = broken/malformed.
      # Uses bash so the exit code is inspectable and 10 can be treated as pass.
      - name: check-backlog
        shell: bash
        run: |
          set +e
          node scripts/pipeline/check-backlog.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 10 ]; then
            exit 0
          fi
          echo "check-backlog failed with exit $code"
          exit "$code"
      # check-sot-bytes: this script has no process.exit calls — it always exits 0
      # and prints "*** DAMAGED ***" on mojibake. Fail the step by grepping output.
      - name: check-sot-bytes
        shell: bash
        run: |
          out=$(node scripts/pipeline/check-sot-bytes.mjs)
          echo "$out"
          if echo "$out" | grep -q "DAMAGED"; then
            echo "check-sot-bytes detected damaged UTF-8"
            exit 1
          fi

  pipeline-tests-windows:
    name: Pipeline — arm-prompt tests (Windows)
    # This job exists ONLY so scripts/pipeline/__tests__/arm-prompt.test.mjs
    # actually runs. Its 8 tests are IS_WIN-gated and SKIP on the ubuntu
    # pipeline-tests job above, so arm-prompt.ps1 shipped with a bug that made
    # it unparseable under Windows PowerShell 5.1 (BOM-less UTF-8 + em dashes
    # decoded as Windows-1252) while CI stayed green throughout. See prompt
    # docs/pr-prompts/... for the incident.
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 for the same reason as pipeline-tests: the linter's
      # gate probes need origin/main, and a rule that quietly does nothing in
      # CI is the failure this cluster exists to prevent.
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22' }
      # shell: bash is REQUIRED. The GitHub windows-latest runner defaults to
      # PowerShell, which does NOT glob-expand arguments to external commands.
      # Without bash, `node --test "scripts/pipeline/__tests__/*.mjs"` receives
      # a literal unexpanded pattern, discovers 0 files, and exits 0 — a green
      # job that ran nothing, recreating the exact blindness this job removes.
      # We then assert on the summary: skipped must be 0, and pass must be at
      # least 8 (the arm-prompt suite). A discovery of nothing must FAIL.
      - name: Pipeline tests (Windows)
        shell: bash
        run: |
          set -uo pipefail
          node --test "scripts/pipeline/__tests__/*.mjs" 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          skipped=$(grep -E 'skipped [0-9]+$' test-output.txt | tail -1 | awk '{print $NF}')
          pass=$(grep -E 'pass [0-9]+$' test-output.txt | tail -1 | awk '{print $NF}')
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::expected skipped=0, got skipped=${skipped:-missing}"
            exit 1
          fi
          if [ -z "${pass:-}" ] || [ "$pass" -lt 8 ]; then
            echo "::error::expected pass>=8 (arm-prompt suite), got pass=${pass:-missing}"
            exit 1
          fi
          echo "OK: pass=$pass skipped=$skipped"

  web:
    name: Web — lint, logic tests, vitest, build
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @project-ops/web lint
      - run: pnpm test:web:logic
      # Full vitest suite — 69 files, 868 tests. Kept as a separate step from
      # test:web:logic (Tendering smoke) so failures point at the right suite.
      - run: pnpm --filter @project-ops/web test
      - run: pnpm --filter @project-ops/web build
        env:
          VITE_API_BASE_URL: http://localhost:3000/api/v1

  raw-error-envelope:
    # Regression gate: prevents any page from reintroducing the raw-error-envelope
    # shapes that the humane-API-errors migration removed.
    # Checked shapes:
    #   throw new Error(await <var>.text())
    #   setError(await <var>.text())
    # Per-line suppression: // raw-error-envelope-allow: <reason>
    # Fix pointer:          apps/web/src/lib/api-errors.ts
    # See docs/engineering/humane-api-errors-gate.md for the full rule.
    name: raw-error-envelope gate — no raw API text() in apps/web/src
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '22' }
      - name: Check for raw-error-envelope call sites
        run: node scripts/pr-gates/check-raw-error-envelope.mjs
