name: Tendering Browser Smoke

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel a PR's in-flight run when a newer commit is pushed to the same PR.
# Pushes to main are never cancelled — every trunk commit gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Decide whether this PR touches any build/test-relevant path. Docs-, prompt-
  # and sot-only PRs yield code=false and let the browser smoke below skip. A
  # required job skipped via a job-level `if:` still satisfies branch protection.
  # Pushes to main always yield code=true (full trunk coverage).
  changes:
    name: Changed-path filter
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        name: Detect build/test-relevant changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(apps/|packages/|prisma/|tests/|scripts/|\.github/workflows/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig)'; then
            echo "code=true"  >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tendering-e2e:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_operations
          POSTGRES_USER: project_ops
          POSTGRES_PASSWORD: project_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_ops -d project_operations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://project_ops:project_ops@localhost:5432/project_operations?schema=public
      API_PORT: 3000
      API_PREFIX: api/v1
      JWT_ACCESS_SECRET: replace-me-access
      JWT_REFRESH_SECRET: replace-me-refresh
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      # E2E suites log in many times per minute from one IP — lift the auth
      # throttle far above the production defaults (5 login / 30 refresh per min).
      AUTH_THROTTLE_LIMIT: 1000
      AUTH_THROTTLE_REFRESH_LIMIT: 1000
      SHAREPOINT_MODE: mock
      SHAREPOINT_SITE_ID: project-operations-site
      SHAREPOINT_LIBRARY_ID: project-operations-library
      SHAREPOINT_ROOT_FOLDER: Project Operations
      # Deterministic 32-byte hex key used solely for CI tests. Real
      # production keys live in Azure Key Vault and are never committed.
      BYOK_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/api exec prisma generate

      - name: Apply Prisma migrations
        run: pnpm --dir apps/api exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @project-ops/api seed

      - name: Validate API build
        run: pnpm --filter @project-ops/api build

      - name: Validate web logic
        run: pnpm test:web:logic

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Tendering browser smoke
        run: pnpm exec playwright test tests/e2e/tendering.spec.ts --reporter=list,html

      - name: Run PR-acceptance E2E suite
        run: pnpm exec playwright test tests/e2e/pr-acceptance --project=chromium --reporter=list,html --workers=1

      - uses: actions/upload-artifact@v4.4.0
        if: ${{ !cancelled() && hashFiles('playwright-report/**') != '' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
