  - id: timeline-history-pagination
    title: "Decide + (if wanted) implement pagination/filtering for job timelines beyond the 50-item cap"
    priority: P3
    why: >
      apps/api/src/modules/platform/timeline.service.ts returns a single capped, newest-first window
      (DEFAULT_LIMIT=50, MAX_LIMIT=200, filtered.slice(0, limit)) with NO cursor/offset pagination. On a
      long-running job, timeline activity older than the most recent 50 events is simply not viewable --
      no "load more", date range, or paging in the panel. Surfaced 2026-08-04 (it is what made the
      batch7 "raising an issue writes a system entry" acceptance test brittle: at >=50 seed items a new
      entry cannot raise the visible count). NOT required for CI/merge -- the test was fixed to assert
      presence-by-title instead. This is purely the UX/product call.
    gate: 'grep -q "DEFAULT_LIMIT = 50" apps/api/src/modules/platform/timeline.service.ts'
    gate_means: 'Still relevant while the un-paginated 50 default stands; discharges once the cap/pagination is reworked in timeline.service.ts.'
    needs_marco: true
    marco_note: >
      DECISION NEEDED (Marco): do users need to see MORE than the last 50 timeline events per entity,
      and if so via (a) pagination / infinite-scroll, (b) a date-range filter, or (c) just raising the
      default toward MAX_LIMIT=200? Only implement across API + timeline panel once you choose. If the
      answer is "50 is fine", say so and this can be deleted. Parked here, not auto-staged.
    order: 14
