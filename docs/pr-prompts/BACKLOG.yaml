      possible, that is a second gap and needs its own item.
      CHAIN STATE 2026-08-19 (Station 06 PR Master), after the re-measure described in "why".
      SHIPPED - slice 1, pr-apierr-s1-tendering (#1224). It went green but left 12 files in its own
      directory unfixed, because its done_when matched only the "res" literal. Those 12 are picked
      up by s3a and s3b below; this is not a regression, it is unfinished work reported as finished.
      SUPERSEDED AND DELETED - pr-apierr-s2-crm-HOLD.md. It carried the same narrow literal and
      would have under-fixed crm the same way. Replaced by s5.
      STAGED NOW - 10 work slices plus a CI gate, all ADMIT, all premises verified alive against
      origin/main 15d9b1d3 with positive and negative controls. Only s3a is armed; the rest are
      HOLD with no dependency between them and can be armed by rename in any order, a few at a
