  - id: gps-native-wrapper-app
    title: "Native wrapper app (Capacitor or similar) for true background GPS - TSheets parity"
    priority: P3
    why: >
      Marco's 2026-07-27 GPS ruling (PR Master session): clock events are hard-blocked without GPS
      (slice A1), a breadcrumb trail runs while the app is open on the clock (slice A2), and all
      field surfaces capture mandatory GPS (slice A3). Full TSheets parity - tracking that survives
      the phone being locked or the app backgrounded - is IMPOSSIBLE in a browser/PWA (mobile
      browsers suspend geolocation when backgrounded). Parity requires shipping the web app inside
      a native wrapper (e.g. Capacitor) with OS background-location permission, store distribution,
      and a worker-facing privacy notice. Big, separate project; Marco explicitly parked it here
      when accepting option A (track-while-open with honest gaps).
    gate: 'test -f docs/decisions/gps-gapless-client-required.md'
    gate_means: 'READY only when a client CONTRACTUALLY REQUIRES a gapless trail. That is the real parking condition, and it is not derivable from the codebase - so it is expressed as a marker file Marco creates: docs/decisions/gps-gapless-client-required.md. No marker, no gate, nothing surfaces. The old gate (breadcrumb shipped AND no apps/mobile) described CAPABILITY, not NEED - both halves were already true, so it passed permanently.'
    needs_marco: true
    marco_note: >
      DECIDED 2026-08-03 (Marco): Option A (track-while-open) stood; wrapper PARKED. 2026-08-12 (Marco):
      briefly reactivated Option B, then RE-SCOPED to WEB-FIRST. Near-term plan = a fieldworker WEB
      version of the ERP (responsive/PWA); NO native app, NO Apple/Google store spend now. The native
      wrapper stays PARKED but DE-RISKED: the web app bakes in wrapper-ready seams (LocationProvider
      abstraction, on-shift lifecycle, consent/disclosure gate) so a future Capacitor wrap is a thin
      step. CAVEAT: web CANNOT do gapless background GPS (browser suspends when backgrounded); if a
      client contractually needs gapless, only the native wrapper delivers it (Apple $99/yr floor for
