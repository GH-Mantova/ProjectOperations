  - id: web-raw-error-envelope-migration
    title: "Finish the humane API-error migration - 82 web files still render the raw JSON envelope"
    priority: P2
    why: >
      apps/web/src/lib/api-errors.ts exists and 22 files use it. But 38 files still do
      `throw new Error(await res.text())` and then set that as the visible error message - 124
      occurrences in total, measured on origin/main. res.text() is the whole HTTP error envelope, so
      the user is shown raw JSON: statusCode, path, timestamp and all. Marco hit this on 2026-08-19
      in the Tip Finder, where a perfectly good API message ("Tender site has no coordinates stored.
      Update the site coordinates in Settings > Map locations") was rendered as the entire envelope.
      sot/02-roadmap-and-status.md:150 records this work as **Done** ("lib/api-errors.ts, 16 files").
      That is misleading: the HELPER is done, the MIGRATION is not. The doc should be corrected by a
      Station 05 doc-reconcile, separately from the code.
      There is also NO CI gate forbidding the pattern (checked .github/ and scripts/pr-gates/), so
      the count can and does grow. A lint rule is arguably worth more than any single batch of edits.
      The two worst-placed instances (TipFinderPanel 2, MapLocationsTab 5) are being fixed
      separately as pr-fix-tipfinder-raw-error-render; this item covers the remaining 36 files.
      SLICING: far over the size-10 limit. Do NOT stage as one prompt. Slice by feature area, plus
      one final slice adding the CI gate so the pattern cannot come back.
      RE-MEASURED 2026-08-19 on origin/main 15d9b1d3 - THE COUNTS ABOVE WERE WRONG AND ARE KEPT
      HERE ONLY AS THE RECORD. The real figures are 82 files and 270 occurrences, not 38 and 124.
      The undercount had a single cause - every premise, gate and count keyed on the literal string
      "throw new Error(await res.text())", and the response variable is not always called "res".
      The codebase uses "response" (130 occurrences), "res" (137), "r" (18), "resp" (5) and about
      forty one-off names, and the same defect also appears as setError(await X.text()).
      PROOF THIS WAS ABOUT TO CAUSE A FALSE VICTORY - slice 1 (#1224, tendering) MERGED with its
      done_when green, and 12 files in its own pages/tendering directory were still broken. Its
      done_when only ever looked for the literal. The register gate had the same flaw and has been
      corrected in this entry.
      RESLICED into 10 work slices plus a CI gate, each 10 files or fewer, together covering all 82
      files exactly once with no overlap and no remainder (verified programmatically before staging).
    gate: 'grep -rqE "(throw new Error\(await [A-Za-z_][A-Za-z0-9_]*\.text\(\)\)|setError\(await [A-Za-z_][A-Za-z0-9_]*\.text\(\)\))" apps/web/src'
    gate_means: >
      READY while any web file still feeds a raw response body into an error message. Dies when the
      last one is migrated.
      CORRECTED 2026-08-19 - the previous gate matched only the literal string
      "throw new Error(await res.text())". That single variable name "res" is why this item
      under-reported the work by 44 files. The gate now matches the SHAPE for any identifier and
      both call forms (throw and setError), so it can no longer report the migration finished while
      files are still broken.
    needs_marco: false
    marco_note: >
      One design question was deliberately NOT decided while fixing the Tip Finder instance, because
      it is Marco's: when a tender site has no stored coordinates, should Tip Finder ERROR (current
      behaviour, and the message does tell you how to fix it), or should it DEGRADE to ranking tips by
      disposal rate alone with distance shown as unavailable? Erroring is honest; degrading is more
